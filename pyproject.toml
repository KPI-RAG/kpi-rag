[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-rag"
version = "0.1.0"
description = "KPI-RAG project"
readme = "README.md"
requires-python = ">=3.11"   # locked numpy 2.3 / pandas 3.0 need 3.11+
# Runtime only (what the dashboard and scripts import). Streamlit Community Cloud installs from uv.lock.
dependencies = [
    "streamlit",
    "chromadb",
    "sentence-transformers",
    "torch>=2.13,<2.14",      # CPU build, see [tool.uv.sources]; 2.13 built the committed index
    "huggingface-hub>=1.27.0",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "openai>=1.0",
    "requests>=2.31",
    "pyyaml",
    "python-dotenv>=1.0",
    "numpy",
    "pandas",
    "pydantic",
    "catboost>=1.2.10",       # loads data/models/*.cbm (src/ml_model.py)
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
]

# No GPU is used anywhere; the default PyPI torch wheel on Linux pulls ~2 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Install src/, scripts/ and dashboard/ as packages so `uv run python scripts/x.py` can import src
# without PYTHONPATH.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit",
    "integration",
    "slow",
    "contract"
]
